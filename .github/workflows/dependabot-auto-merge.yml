name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Find open PR for this workflow run
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api \
            "/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.event.workflow_run.head_branch }}&state=open" \
            --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # Single-package PRs are classified from the title's "from X to Y"
      # (LAB-1339/LAB-1350); pip/npm requirement-range PRs state nothing else
      # to parse. Grouped PRs ("... with N updates") are classified from the
      # "update-type: version-update:semver-<level>" entries Dependabot writes
      # into the commit message, one per package (LAB-1853). The PR body can't
      # be used: GitHub truncates it at 65,536 characters. A group merges only
      # when the PR has one commit and exactly N entries, all minor/patch.
      # Same rule as homelab-v3's dependabot-collect.py classify_pr - keep
      # them in sync.
      - name: Merge if every version bump in the PR is patch/minor
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        run: |
          TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          COMMITS=$(gh api "/repos/$GH_REPO/pulls/$PR_NUMBER/commits" --jq '[.[].commit.message]')
          LEVEL=$(TITLE="$TITLE" COMMITS="$COMMITS" python3 -c '
          import json, os, re
          title = os.environ["TITLE"]
          commits = json.loads(os.environ["COMMITS"])
          m = re.search(r"from\s+\S*?(\d+(?:\.\d+){0,3})\s+to\s+\S*?(\d+(?:\.\d+){0,3})", title, re.IGNORECASE)
          size = re.search(r"\bwith (\d+) updates?\b", title, re.IGNORECASE)
          if m:
              old = [int(x) for x in m.group(1).split(".")]
              new = [int(x) for x in m.group(2).split(".")]
              print("major" if new[0] != old[0] else "safe")
          elif not size or len(commits) != 1:
              print("unknown")
          else:
              levels = re.findall(r"^\s*update-type:\s*version-update:semver-(\w+)\s*$", commits[0], re.MULTILINE)
              if len(levels) != int(size.group(1)):
                  print("unknown")
              elif "major" in levels:
                  print("major")
              elif set(levels) <= {"minor", "patch"}:
                  print("safe")
              else:
                  print("unknown")
          ')

          case "$LEVEL" in
            safe) gh pr merge "$PR_NUMBER" --squash --delete-branch ;;
            major) echo "Skipping - major version bump (PR #$PR_NUMBER)" ;;
            *) echo "No parseable version bump in PR title or commit metadata - skipping to be safe (PR #$PR_NUMBER)" ;;
          esac
