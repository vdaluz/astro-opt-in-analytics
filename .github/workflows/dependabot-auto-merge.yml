name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Find open PR for this workflow run
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api \
            "/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.event.workflow_run.head_branch }}&state=open" \
            --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # Title-based semver parsing, not body text. The documented body marker
      # (version-update:semver-<level>) doesn't exist in the API response at
      # all (confirmed live, LAB-1339), and body-text parsing ("Updates `pkg`
      # from X to Y" / "Bumps [pkg](url) from X to Y") misses pip/npm
      # requirement-range PRs whose body never states a concrete version pair
      # in that exact shape. The PR title reliably has "from X to Y" for both
      # shapes. Same regex as homelab-v3's dependabot-collect.py classify_pr
      # (LAB-1339/LAB-1350) -- keep both in sync if either changes.
      - name: Merge if title indicates a patch/minor version bump
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        run: |
          TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          LEVEL=$(TITLE="$TITLE" python3 -c '
          import os, re
          m = re.search(r"from\s+\S*?(\d+(?:\.\d+){0,3})\s+to\s+\S*?(\d+(?:\.\d+){0,3})", os.environ["TITLE"], re.IGNORECASE)
          if not m:
              print("unknown")
          else:
              old = [int(x) for x in m.group(1).split(".")]
              new = [int(x) for x in m.group(2).split(".")]
              print("major" if new[0] != old[0] else "safe")
          ')

          case "$LEVEL" in
            safe) gh pr merge "$PR_NUMBER" --squash --delete-branch ;;
            major) echo "Skipping - major version bump (PR #$PR_NUMBER)" ;;
            *) echo "No parseable version bump in PR title - skipping to be safe (PR #$PR_NUMBER)" ;;
          esac
