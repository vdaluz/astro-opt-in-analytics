# Publish to npm on tag push, using Trusted Publishing (OIDC) - no NPM_TOKEN secret.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # No registry-url: it makes setup-node write an empty _authToken line to
          # .npmrc, which npm reads as "auth already configured" and skips the OIDC
          # exchange entirely - breaks Trusted Publishing. npm's default registry is
          # already registry.npmjs.org. https://github.com/actions/setup-node/issues/1551

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish
        run: npm publish
