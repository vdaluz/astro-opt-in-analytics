# Publish to npm on tag push, using Trusted Publishing (OIDC) - no NPM_TOKEN secret.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          # No registry-url: it makes setup-node write an empty _authToken line to
          # .npmrc, which npm reads as "auth already configured" and skips the OIDC
          # exchange entirely - breaks Trusted Publishing. npm's default registry is
          # already registry.npmjs.org. https://github.com/actions/setup-node/issues/1551

      - name: Install dependencies
        run: npm ci

      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish
        run: npm publish
